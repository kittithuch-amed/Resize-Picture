<!doctype html>
<html lang="th">
  <head>
    <base target="_top" />
    <meta charset="UTF-8" />

    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />

    <title>ลดขนาดรูปภาพ</title>

    <style>
      * {
        box-sizing: border-box;
      }

      :root {
        --ink: #162033;
        --muted: #697386;
        --line: #e5eaf2;
        --primary: #3867f2;
        --primary-dark: #244eda;
        --success: #16855b;
      }

      body {
        margin: 0;
        min-height: 100vh;
        min-height: 100dvh;
        padding: max(28px, env(safe-area-inset-top))
          max(18px, env(safe-area-inset-right))
          max(28px, env(safe-area-inset-bottom))
          max(18px, env(safe-area-inset-left));
        background:
          radial-gradient(circle at 8% 4%, #dce8ff 0, transparent 32rem),
          radial-gradient(circle at 94% 96%, #d6f5e9 0, transparent 28rem),
          #f7f9fc;
        font-family:
          "Noto Sans Thai", -apple-system, BlinkMacSystemFont, "Segoe UI", Arial,
          sans-serif;
        color: var(--ink);
      }

      .container {
        max-width: 560px;
        margin: auto;
      }

      .card {
        background: rgba(255, 255, 255, 0.92);
        padding: 32px;
        border: 1px solid rgba(255, 255, 255, 0.8);
        border-radius: 28px;
        box-shadow: 0 18px 55px rgba(39, 61, 98, 0.14);
      }

      h1 {
        margin: 0;
        text-align: center;
        font-size: clamp(26px, 6vw, 32px);
        line-height: 1.25;
        letter-spacing: -0.04em;
      }

      .subtitle {
        text-align: center;
        color: var(--muted);
        margin: 10px 0 28px;
        font-size: 15px;
      }

      #fileInput {
        display: none;
      }

      .uploadButton {
        display: block;
        width: 100%;
        padding: 19px 18px;
        border: 1px solid transparent;
        border-radius: 16px;
        background: linear-gradient(135deg, var(--primary), #5e80f7);
        color: white;
        text-align: center;
        font-size: 17px;
        font-weight: 700;
        cursor: pointer;
        min-height: 56px;
        touch-action: manipulation;
        -webkit-tap-highlight-color: transparent;
        box-shadow: 0 10px 20px rgba(56, 103, 242, 0.25);
        transition: transform 0.18s ease, box-shadow 0.18s ease,
          background 0.18s ease;
      }

      .uploadButton:hover {
        background: linear-gradient(135deg, var(--primary-dark), var(--primary));
        box-shadow: 0 13px 24px rgba(56, 103, 242, 0.3);
        transform: translateY(-1px);
      }

      .uploadButton:active,
      button:active {
        transform: translateY(1px);
      }

      .loading {
        display: none;
        margin-top: 25px;
        text-align: center;
      }

      .spinner {
        width: 42px;
        height: 42px;
        margin: auto;
        border: 4px solid #e7ebf2;
        border-top-color: var(--primary);
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
      }

      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }

      .loadingText {
        margin-top: 12px;
        color: var(--muted);
      }

      .result {
        display: none;
        margin-top: 26px;
      }

      #preview {
        display: block;
        width: 100%;
        max-height: 320px;
        object-fit: contain;
        background: #f3f6fa;
        border: 1px solid var(--line);
        border-radius: 18px;
      }

      .info {
        margin-top: 16px;
        background: #f8faff;
        padding: 8px 18px;
        border: 1px solid var(--line);
        border-radius: 18px;
      }

      .row {
        display: flex;
        justify-content: space-between;
        gap: 18px;
        padding: 13px 0;
        border-bottom: 1px solid var(--line);
        color: var(--muted);
        font-size: 14px;
      }

      .row:last-child {
        border-bottom: none;
      }

      .green {
        color: var(--success);
      }

      .row strong {
        color: var(--ink);
        text-align: right;
      }

      .row strong.green {
        color: var(--success);
      }

      .downloadButton {
        width: 100%;
        margin-top: 20px;
        border: 0;
        padding: 17px;
        border-radius: 15px;
        background: var(--success);
        color: white;
        font-size: 17px;
        font-weight: 700;
        cursor: pointer;
        min-height: 52px;
        touch-action: manipulation;
        -webkit-tap-highlight-color: transparent;
        box-shadow: 0 9px 18px rgba(22, 133, 91, 0.2);
        transition: transform 0.18s ease, background 0.18s ease;
      }

      .downloadButton:hover {
        background: #0f704a;
      }

      .newButton {
        width: 100%;
        margin-top: 12px;
        border: 1px solid var(--line);
        padding: 15px;
        border-radius: 15px;
        background: #fff;
        color: #455268;
        font-size: 16px;
        font-weight: 600;
        cursor: pointer;
        min-height: 50px;
        touch-action: manipulation;
        -webkit-tap-highlight-color: transparent;
        transition: background 0.18s ease, transform 0.18s ease;
      }

      .newButton:hover {
        background: #f5f7fb;
      }

      .error {
        display: none;
        margin-top: 18px;
        padding: 14px 16px;
        border: 1px solid #f5cbc8;
        border-radius: 14px;
        background: #fff5f4;
        color: #b42318;
        text-align: center;
      }

      .privacy {
        margin-top: 24px;
        text-align: center;
        color: var(--muted);
        font-size: 13px;
        line-height: 1.5;
      }

      .credit {
        display: block;
        margin-top: 8px;
        color: #556277;
      }

      @media (max-width: 480px) {
        body {
          padding: 16px;
        }

        .card {
          padding: 26px 20px;
          border-radius: 24px;
        }

        .row {
          gap: 10px;
          font-size: 13px;
        }

        .row strong {
          max-width: 58%;
          overflow-wrap: anywhere;
        }

        .result {
          margin-top: 18px;
        }

        #preview {
          max-height: 165px;
        }

        .info {
          margin-top: 12px;
          padding: 4px 14px;
        }

        .row {
          padding: 8px 0;
        }

        .downloadButton {
          margin-top: 14px;
          padding: 13px;
        }

        .newButton {
          margin-top: 8px;
          padding: 12px;
        }

        .privacy {
          margin-top: 18px;
        }
      }

      @media (max-width: 360px) {
        body {
          padding: 12px;
        }

        .card {
          padding: 22px 16px;
          border-radius: 20px;
        }

        .subtitle {
          margin-bottom: 22px;
        }
      }
    </style>
  </head>

  <body>
    <div class="container">
      <div class="card">
        <h1>ลดขนาดรูปภาพ</h1>

        <div class="subtitle">ลดขนาดรูปอัตโนมัติไม่เกิน 1 MB</div>

        <label for="fileInput" class="uploadButton">เลือกหรือถ่ายรูป</label>

        <input id="fileInput" type="file" accept="image/*" />

        <div id="loading" class="loading" role="status" aria-live="polite">
          <div class="spinner"></div>

          <div class="loadingText">กำลังลดขนาดรูปภาพ...</div>
        </div>

        <div id="errorBox" class="error" role="alert"></div>

        <div id="result" class="result" aria-live="polite">
          <img id="preview" alt="ตัวอย่างรูปภาพหลังลดขนาด" />

          <div class="info">
            <div class="row">
              <span>ไฟล์ต้นฉบับ</span>
              <strong id="originalSize">-</strong>
            </div>

            <div class="row">
              <span>ความละเอียดเดิม</span>
              <strong id="originalResolution">-</strong>
            </div>

            <div class="row">
              <span>ไฟล์ใหม่</span>
              <strong id="newSize" class="green">-</strong>
            </div>

            <div class="row">
              <span>ความละเอียดใหม่</span>
              <strong id="newResolution">-</strong>
            </div>

            <div class="row">
              <span>ลดขนาด</span>
              <strong id="percent" class="green">-</strong>
            </div>
          </div>

          <button type="button" class="downloadButton" onclick="downloadImage()">
            บันทึก / แชร์รูป
          </button>

          <button type="button" class="newButton" onclick="resetApp()">เลือกรูปใหม่</button>
        </div>

        <div class="privacy">
          รูปภาพประมวลผลภายในเบราว์เซอร์<br />
          ไม่มีการบันทึกรูปภาพ
          <span class="credit">
            Developed by KTT.W<br />
            Army Medical Department.
          </span>
        </div>
      </div>
    </div>

    <script>
      const MAX_SIZE = 1024 * 1024;

      // ตั้งเป้า 950 KB
      // เพื่อไม่ให้ชนขอบ 1 MB
      const TARGET_SIZE = 950 * 1024;

      let finalBlob = null;
      let finalUrl = null;
      let finalFileName = null;
      let isProcessing = false;

      // ==========================================
      // เลือกรูป
      // ==========================================

      document
        .getElementById("fileInput")
        .addEventListener("change", async function (event) {
          const file = event.target.files[0];

          if (!file) {
            return;
          }

          if (isProcessing) {
            return;
          }

          hideError();
          isProcessing = true;

          document.getElementById("result").style.display = "none";
          document.getElementById("loading").style.display = "block";

          try {
            await processImage(file);
          } catch (error) {
            console.error(error);
            showError(error.message);
          } finally {
            isProcessing = false;
            document.getElementById("loading").style.display = "none";
          }
        });

      // ==========================================
      // Process
      // ==========================================

      async function processImage(file) {
        if (file.type && !file.type.startsWith("image/")) {
          throw new Error("กรุณาเลือกไฟล์รูปภาพ");
        }

        const image = await loadImage(file);

        const originalWidth = image.naturalWidth;
        const originalHeight = image.naturalHeight;

        document.getElementById("originalSize").textContent = formatBytes(
          file.size,
        );

        document.getElementById("originalResolution").textContent =
          originalWidth + " × " + originalHeight;

        const result = await compressImage(
          image,
          originalWidth,
          originalHeight,
        );

        if (result.blob.size > MAX_SIZE) {
          throw new Error("ไม่สามารถลดรูปให้ต่ำกว่า 1 MB ได้");
        }

        finalBlob = result.blob;

        // ล้าง URL เก่า
        if (finalUrl) {
          URL.revokeObjectURL(finalUrl);
        }

        finalUrl = URL.createObjectURL(finalBlob);

        document.getElementById("preview").src = finalUrl;

        document.getElementById("newSize").textContent =
          formatBytes(finalBlob.size);

        document.getElementById("newResolution").textContent =
          result.width + " × " + result.height;

        let percent = 100 - (finalBlob.size / file.size) * 100;

        if (percent < 0) {
          percent = 0;
        }

        document.getElementById("percent").textContent =
          percent.toFixed(1) + "%";

        finalFileName = createFileName();

        document.getElementById("result").style.display = "block";
      }

      // ==========================================
      // โหลดรูป
      // ==========================================

      function loadImage(file) {
        return new Promise((resolve, reject) => {
          const image = new Image();

          const url = URL.createObjectURL(file);

          image.onload = function () {
            URL.revokeObjectURL(url);

            resolve(image);
          };

          image.onerror = function () {
            URL.revokeObjectURL(url);

            reject(new Error("ไม่สามารถเปิดรูปภาพได้"));
          };

          image.src = url;
        });
      }

      // ==========================================
      // ลดขนาดรูป
      // ==========================================

      async function compressImage(image, originalWidth, originalHeight) {
        let width = originalWidth;
        let height = originalHeight;

        /*
         * มือถือปัจจุบันมักถ่ายรูป
         * 3000-8000 pixels
         *
         * เริ่มต้นจำกัดด้านยาวที่ 2560
         */
        const MAX_DIMENSION = 2560;

        if (width > MAX_DIMENSION || height > MAX_DIMENSION) {
          const scale = Math.min(MAX_DIMENSION / width, MAX_DIMENSION / height);

          width = Math.round(width * scale);

          height = Math.round(height * scale);
        }

        /*
         * Strategy
         *
         * 1. ลด Quality ก่อน
         * 2. ถ้ายังเกิน → ลด Resolution
         * 3. ทำซ้ำจน <= 950 KB
         */

        for (let resizeRound = 0; resizeRound < 10; resizeRound++) {
          const canvas = document.createElement("canvas");

          canvas.width = width;
          canvas.height = height;

          const ctx = canvas.getContext("2d");

          ctx.imageSmoothingEnabled = true;
          ctx.imageSmoothingQuality = "high";

          /*
           * JPEG ไม่มี transparency
           * จึงใส่พื้นหลังขาว
           */
          ctx.fillStyle = "#FFFFFF";

          ctx.fillRect(0, 0, width, height);

          ctx.drawImage(image, 0, 0, width, height);

          /*
           * เริ่มจากคุณภาพสูง 95%
           */
          for (let quality = 0.95; quality >= 0.4; quality -= 0.05) {
            const blob = await canvasToBlob(canvas, "image/jpeg", quality);

            if (blob.size <= TARGET_SIZE) {
              return {
                blob: blob,
                width: width,
                height: height,
                quality: quality,
              };
            }
          }

          /*
           * Quality ต่ำแล้วแต่ยังเกิน
           * ลด Resolution ลงอีก 15%
           */

          width = Math.round(width * 0.85);

          height = Math.round(height * 0.85);

          if (width < 500 || height < 500) {
            break;
          }
        }

        throw new Error(
          "รูปภาพนี้มีขนาดใหญ่เกินไปและไม่สามารถลดให้ต่ำกว่า 1 MB ได้",
        );
      }

      // ==========================================
      // Canvas → JPEG Blob
      // ==========================================

      function canvasToBlob(canvas, mimeType, quality) {
        return new Promise((resolve, reject) => {
          canvas.toBlob(
            function (blob) {
              if (blob) {
                resolve(blob);
              } else {
                reject(new Error("ไม่สามารถสร้างไฟล์รูปภาพได้"));
              }
            },
            mimeType,
            quality,
          );
        });
      }

      // ==========================================
      // Download
      // ==========================================

      function downloadImage() {
        if (!finalBlob) {
          return;
        }

        const downloadUrl = URL.createObjectURL(finalBlob);
        const imageFile = new File([finalBlob], finalFileName, {
          type: "image/jpeg",
        });

        // โทรศัพท์ที่รองรับจะเปิดเมนูบันทึกหรือแชร์ของระบบ
        if (navigator.canShare && navigator.canShare({ files: [imageFile] })) {
          navigator
            .share({ files: [imageFile], title: "รูปภาพที่ลดขนาดแล้ว" })
            .catch((error) => {
              if (error.name !== "AbortError") {
                downloadFromUrl(downloadUrl);
              }
            })
            .finally(() => {
              setTimeout(() => URL.revokeObjectURL(downloadUrl), 1500);
            });
          return;
        }

        downloadFromUrl(downloadUrl);
        setTimeout(() => URL.revokeObjectURL(downloadUrl), 1500);
      }

      function downloadFromUrl(url) {
        const link = document.createElement("a");

        link.href = url;

        link.download = finalFileName;

        document.body.appendChild(link);

        link.click();

        document.body.removeChild(link);

      }

      // ==========================================
      // ตั้งชื่อไฟล์
      // ==========================================

      function createFileName() {
        const date = new Date();

        const yyyy = date.getFullYear();

        const mm = String(date.getMonth() + 1).padStart(2, "0");

        const dd = String(date.getDate()).padStart(2, "0");

        const hh = String(date.getHours()).padStart(2, "0");

        const mi = String(date.getMinutes()).padStart(2, "0");

        const ss = String(date.getSeconds()).padStart(2, "0");

        return "IMG_" + yyyy + mm + dd + "_" + hh + mi + ss + ".jpg";
      }

      // ==========================================
      // Reset
      // ==========================================

      function resetApp() {
        document.getElementById("fileInput").value = "";

        document.getElementById("result").style.display = "none";

        finalBlob = null;

        if (finalUrl) {
          URL.revokeObjectURL(finalUrl);

          finalUrl = null;
        }

        hideError();
      }

      // ==========================================
      // แสดงขนาดไฟล์
      // ==========================================

      function formatBytes(bytes) {
        const mb = bytes / 1024 / 1024;

        if (mb >= 1) {
          return mb.toFixed(2) + " MB";
        }

        return (bytes / 1024).toFixed(0) + " KB";
      }

      // ==========================================
      // Error
      // ==========================================

      function showError(message) {
        const box = document.getElementById("errorBox");

        box.textContent = message;

        box.style.display = "block";
      }

      function hideError() {
        document.getElementById("errorBox").style.display = "none";
      }
    </script>
  </body>
</html>
