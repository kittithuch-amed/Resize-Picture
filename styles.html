<style>
* {
        box-sizing: border-box;
      }
      :root {
        --ink: #162033;
        --muted: #697386;
        --line: #e5eaf2;
        --primary: #3867f2;
        --primary-dark: #244eda;
        --success: #16855b;
      }

      body {
        margin: 0;
        min-height: 100vh;
        min-height: 100dvh;
        padding: max(28px, env(safe-area-inset-top))
          max(18px, env(safe-area-inset-right))
          max(28px, env(safe-area-inset-bottom))
          max(18px, env(safe-area-inset-left));
        background:
          radial-gradient(circle at 8% 4%, #dce8ff 0, transparent 32rem),
          radial-gradient(circle at 94% 96%, #d6f5e9 0, transparent 28rem),
          #f7f9fc;
        font-family:
          "Noto Sans Thai", -apple-system, BlinkMacSystemFont, "Segoe UI", Arial,
          sans-serif;
        color: var(--ink);
      }

      .container {
        max-width: 560px;
        margin: auto;
      }

      .card {
        background: rgba(255, 255, 255, 0.92);
        padding: 32px;
        border: 1px solid rgba(255, 255, 255, 0.8);
        border-radius: 28px;
        box-shadow: 0 18px 55px rgba(39, 61, 98, 0.14);
      }

      h1 {
        margin: 0;
        text-align: center;
        font-size: clamp(26px, 6vw, 32px);
        line-height: 1.25;
        letter-spacing: -0.04em;
      }

      .subtitle {
        text-align: center;
        color: var(--muted);
        margin: 10px 0 28px;
        font-size: 15px;
      }

      #fileInput {
        display: none;
      }

      .uploadButton {
        display: block;
        width: 100%;
        padding: 19px 18px;
        border: 1px solid transparent;
        border-radius: 16px;
        background: linear-gradient(135deg, var(--primary), #5e80f7);
        color: white;
        text-align: center;
        font-size: 17px;
        font-weight: 700;
        cursor: pointer;
        min-height: 56px;
        touch-action: manipulation;
        -webkit-tap-highlight-color: transparent;
        box-shadow: 0 10px 20px rgba(56, 103, 242, 0.25);
        transition: transform 0.18s ease, box-shadow 0.18s ease,
          background 0.18s ease;
      }

      .uploadButton:hover {
        background: linear-gradient(135deg, var(--primary-dark), var(--primary));
        box-shadow: 0 13px 24px rgba(56, 103, 242, 0.3);
        transform: translateY(-1px);
      }

      .uploadButton:active,
      button:active {
        transform: translateY(1px);
      }

      .loading {
        display: none;
        margin-top: 25px;
        text-align: center;
      }

      .spinner {
        width: 42px;
        height: 42px;
        margin: auto;
        border: 4px solid #e7ebf2;
        border-top-color: var(--primary);
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
      }

      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }

      .loadingText {
        margin-top: 12px;
        color: var(--muted);
      }

      .result {
        display: none;
        margin-top: 26px;
      }

      #preview {
        display: block;
        width: 100%;
        max-height: 320px;
        object-fit: contain;
        background: #f3f6fa;
        border: 1px solid var(--line);
        border-radius: 18px;
      }

      .info {
        margin-top: 16px;
        background: #f8faff;
        padding: 8px 18px;
        border: 1px solid var(--line);
        border-radius: 18px;
      }

      .row {
        display: flex;
        justify-content: space-between;
        gap: 18px;
        padding: 13px 0;
        border-bottom: 1px solid var(--line);
        color: var(--muted);
        font-size: 14px;
      }

      .row:last-child {
        border-bottom: none;
      }

      .green {
        color: var(--success);
      }

      .row strong {
        color: var(--ink);
        text-align: right;
      }

      .row strong.green {
        color: var(--success);
      }

      .downloadButton {
        width: 100%;
        margin-top: 20px;
        border: 0;
        padding: 17px;
        border-radius: 15px;
        background: var(--success);
        color: white;
        font-size: 17px;
        font-weight: 700;
        cursor: pointer;
        min-height: 52px;
        touch-action: manipulation;
        -webkit-tap-highlight-color: transparent;
        box-shadow: 0 9px 18px rgba(22, 133, 91, 0.2);
        transition: transform 0.18s ease, background 0.18s ease;
      }

      .downloadButton:hover {
        background: #0f704a;
      }

      .newButton {
        width: 100%;
        margin-top: 12px;
        border: 1px solid var(--line);
        padding: 15px;
        border-radius: 15px;
        background: #fff;
        color: #455268;
        font-size: 16px;
        font-weight: 600;
        cursor: pointer;
        min-height: 50px;
        touch-action: manipulation;
        -webkit-tap-highlight-color: transparent;
        transition: background 0.18s ease, transform 0.18s ease;
      }

      .newButton:hover {
        background: #f5f7fb;
      }

      .error {
        display: none;
        margin-top: 18px;
        padding: 14px 16px;
        border: 1px solid #f5cbc8;
        border-radius: 14px;
        background: #fff5f4;
        color: #b42318;
        text-align: center;
      }

      .privacy {
        margin-top: 24px;
        text-align: center;
        color: var(--muted);
        font-size: 13px;
        line-height: 1.5;
      }

      .credit {
        display: block;
        margin-top: 8px;
        color: #556277;
      }

      @media (max-width: 480px) {
        body {
          padding: 16px;
        }

        .card {
          padding: 26px 20px;
          border-radius: 24px;
        }

        .row {
          gap: 10px;
          font-size: 13px;
        }

        .row strong {
          max-width: 58%;
          overflow-wrap: anywhere;
        }

        .result {
          margin-top: 18px;
        }

        #preview {
          max-height: 165px;
        }

        .info {
          margin-top: 12px;
          padding: 4px 14px;
        }

        .row {
          padding: 8px 0;
        }

        .downloadButton {
          margin-top: 14px;
          padding: 13px;
        }

        .newButton {
          margin-top: 8px;
          padding: 12px;
        }

        .privacy {
          margin-top: 18px;
        }
      }

      @media (max-width: 360px) {
        body {
          padding: 12px;
        }

        .card {
          padding: 22px 16px;
          border-radius: 20px;
        }

        .subtitle {
          margin-bottom: 22px;
        }
      }
</style>
